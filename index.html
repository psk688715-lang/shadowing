<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2C4BC9">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>쉐도잉 복습장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column like a script page — home with streak + lesson starters, a lesson runs one exercise per screen with a fixed answer bar */
:root{
  --paper:#F3F5F8; --card:#FFFFFF; --ink:#1A1E29; --muted:#5B6476; --line:#D9DEE7;
  --accent:#2C4BC9; --accent-ink:#FFFFFF; --mark:#FFE16B; --mark-ink:#1A1E29;
  --good:#1D8656; --good-soft:#DDF2E7; --warn:#A86A12; --bad:#BD3B34; --bad-soft:#F8E1DF; --soft:#E8ECF6;
  --f-script:"Courier Prime","Courier New",Courier,monospace;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#101319; --card:#191D26; --ink:#E7EAF1; --muted:#99A1B3; --line:#2B3140;
  --accent:#8CA4FF; --accent-ink:#0E1220; --mark:#5E5014; --mark-ink:#F4EBC0;
  --good:#4CC28A; --good-soft:#163527; --warn:#E0A64C; --bad:#F0736A; --bad-soft:#3A1D1C; --soft:#222838; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#101319; --card:#191D26; --ink:#E7EAF1; --muted:#99A1B3; --line:#2B3140;
  --accent:#8CA4FF; --accent-ink:#0E1220; --mark:#5E5014; --mark-ink:#F4EBC0;
  --good:#4CC28A; --good-soft:#163527; --warn:#E0A64C; --bad:#F0736A; --bad-soft:#3A1D1C; --soft:#222838; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 120px;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-size:21px;margin:0;letter-spacing:-.01em}
h1 small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.04em}
h2{font-size:16px;margin:0}
.stats{display:flex;gap:16px;font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;align-items:flex-end}
.stat b{font-size:19px;line-height:1.1}
.stat span{font-size:11px;color:var(--muted);letter-spacing:.04em}
.stat.hot b{color:var(--warn)}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line)}
nav button{all:unset;cursor:pointer;padding:8px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
nav button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;font-size:13px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:var(--card)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{all:unset;cursor:pointer;font-size:12px;padding:5px 10px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--soft);color:var(--ink);font-weight:500}
.meter{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px}
.hint{font-size:13px;color:var(--muted)}
.status{font-size:13px;padding:8px 12px;border-radius:6px;background:var(--soft);color:var(--muted)}
.empty{padding:26px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.btn{all:unset;cursor:pointer;text-align:center;padding:11px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-weight:500;font-size:15px;box-sizing:border-box}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:6px 11px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.4;cursor:default}
.btn kbd{font-family:var(--f-script);font-size:11px;opacity:.7;margin-left:6px}
/* home */
.today{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0)}
.ring div{width:66px;height:66px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;line-height:1.1}
.ring b{font-size:20px} .ring span{font-size:11px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:64px}
.week div{display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end;font-size:10px;color:var(--muted)}
.week i{display:block;width:100%;max-width:26px;border-radius:3px 3px 0 0;background:var(--accent);min-height:2px}
.week i.zero{background:var(--line)}
.starts{display:grid;grid-template-columns:1fr;gap:8px}
.start{all:unset;cursor:pointer;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.start:hover{border-color:var(--muted)}
.start .ic{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:var(--soft);color:var(--accent)}
.start .ic svg{width:24px;height:24px}
.start b{display:block;font-size:15px}
.start span{font-size:12px;color:var(--muted)}
.start.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.start.main .ic{background:rgba(255,255,255,.18);color:var(--accent-ink)}
.start.main span{color:var(--accent-ink);opacity:.85}
/* lesson */
.lesson{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 190px;display:flex;flex-direction:column;gap:18px}
.ltop{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.x{all:unset;cursor:pointer;font-size:22px;line-height:1;color:var(--muted);padding:4px 6px}
.ltop .bar{height:10px;border-radius:5px}
.ltop .bar i{background:var(--good)}
.ask{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.prompt{font-size:21px;font-weight:500;line-height:1.45;overflow-wrap:anywhere}
.prompt.en{font-family:var(--f-script);font-weight:700;font-size:23px}
.prompt .hl,.hl{background:linear-gradient(transparent 58%,var(--mark) 58%);padding:0 2px}
.slug{font-family:var(--f-script);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);overflow-wrap:anywhere}
.play{display:flex;gap:10px;align-items:center}
.pbtn{all:unset;cursor:pointer;display:grid;place-items:center;border-radius:14px;background:var(--accent);color:var(--accent-ink)}
.pbtn.big{width:84px;height:84px} .pbtn.big svg{width:40px;height:40px}
.pbtn.mid{width:52px;height:52px;border-radius:12px} .pbtn.mid svg{width:26px;height:26px}
.pbtn.slow{background:var(--soft);color:var(--accent)}
.opts{display:grid;gap:8px}
.opt{all:unset;cursor:pointer;padding:12px 14px;border:1.5px solid var(--line);border-bottom-width:3px;border-radius:10px;background:var(--card);display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;overflow-wrap:anywhere}
.opt .n{font-family:var(--f-script);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 6px}
.opt.en{font-family:var(--f-script);font-weight:700}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.answer{min-height:96px;border-bottom:1.5px solid var(--line);padding-bottom:8px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;background:repeating-linear-gradient(transparent 0 47px,var(--line) 47px 48px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{all:unset;cursor:pointer;font-family:var(--f-script);font-weight:700;font-size:16px;padding:7px 12px;border:1.5px solid var(--line);border-bottom-width:3px;border-radius:9px;background:var(--card);touch-action:none;user-select:none;-webkit-user-select:none}
.tile.drag{position:relative;z-index:3;cursor:grabbing;border-color:var(--accent);box-shadow:0 8px 18px rgba(0,0,0,.18)}
.tile.ins{box-shadow:-5px 0 0 -1px var(--accent)}
.answer.ins-end::after{content:"";width:3px;height:34px;align-self:center;background:var(--accent);border-radius:2px}
.tile.used{visibility:hidden}
textarea,input[type=text],input[type=search]{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea.en,input.en{font-family:var(--f-script);font-size:17px}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:0}
.reveal{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.reveal .en{font-family:var(--f-script);font-weight:700;font-size:20px}
.miss{text-decoration:underline wavy var(--bad);text-underline-offset:4px}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.foot.ok{background:var(--good-soft);border-color:var(--good)}
.foot.no{background:var(--bad-soft);border-color:var(--bad)}
.foot .in{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.foot .msg{display:flex;flex-direction:column;gap:2px}
.foot .msg b{font-size:17px}
.foot.ok .msg b{color:var(--good)} .foot.no .msg b{color:var(--bad)}
.foot .msg .en{font-family:var(--f-script);font-weight:700;overflow-wrap:anywhere}
.foot .explain{max-height:48vh;overflow:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink)}
.foot .explain .xh{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.foot .explain .xt{font-family:var(--f-script);font-weight:700}
.foot .explain .en{font-family:var(--f-script);font-weight:700;overflow-wrap:anywhere}
.foot .explain dl.ex{font-size:13.5px}
dl.ex .mut{color:var(--muted);font-size:12.5px}
.foot .acts{display:grid;grid-template-columns:1fr;gap:8px}
.foot .acts.two{grid-template-columns:1fr 1fr}
.foot.ok .btn.primary{background:var(--good);border-color:var(--good);color:var(--card)}
.foot.no .btn.primary{background:var(--bad);border-color:var(--bad);color:var(--card)}
.result{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding-top:24px}
.result h2{font-size:24px}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.rgrid div{border:1.5px solid var(--line);border-radius:10px;padding:10px 6px;font-variant-numeric:tabular-nums}
.rgrid b{display:block;font-size:22px}
.rgrid span{font-size:12px;color:var(--muted)}
/* flashcards + notes */
.stage{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:12px;min-height:240px;cursor:pointer}
.q{font-size:22px;line-height:1.45;font-weight:500;overflow-wrap:anywhere}
.q.en{font-family:var(--f-script);font-weight:700;font-size:23px}
.a{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.a .main{font-size:17px;font-weight:500}
dl.ex{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
dl.ex dt{color:var(--muted);font-size:12px;padding-top:2px;white-space:nowrap}
dl.ex dd{margin:0;min-width:0;overflow-wrap:anywhere}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.speak{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--accent)}
.speak svg{width:16px;height:16px}
.note{border-top:1px solid var(--line);padding-block:12px;display:flex;flex-direction:column;gap:8px}
.note:first-child{border-top:0;padding-top:0}
.note h3{margin:0;font-size:15px;overflow-wrap:anywhere}
.note .date{font-family:var(--f-script);font-size:12px;color:var(--muted)}
.note .acts{display:flex;flex-wrap:wrap;gap:6px}
.clist{display:flex;flex-direction:column;font-size:14px;max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.citem{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;padding:7px 10px;border-top:1px solid var(--line)}
.citem:first-child{border-top:0}
.citem .f{font-family:var(--f-script);font-weight:700}
.citem .lv{font-size:11px;color:var(--muted)}
.drop{border:1.5px dashed var(--line);border-radius:6px;padding:14px;text-align:center;color:var(--muted);font-size:13px}
.drop.over{border-color:var(--accent);color:var(--accent)}
@media (max-width:520px){.citem{grid-template-columns:1fr;gap:2px}.prompt{font-size:19px}.prompt.en{font-size:21px}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:6px;font-size:14px;max-width:calc(100% - 32px);z-index:5}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
.kohint{font-size:17px;font-weight:500;color:var(--ink);border-left:3px solid var(--mark);padding-left:10px}
.lnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(10,14,25,.45);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal .box{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
.modal .box b{font-size:17px}
.modal .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.mt{all:unset;box-sizing:border-box;cursor:pointer;min-height:54px;padding:8px 10px;border:1.5px solid var(--line);border-bottom-width:3px;border-radius:10px;background:var(--card);display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;line-height:1.35;overflow-wrap:anywhere}
.mt.en{font-family:var(--f-script);font-weight:700;font-size:15px}
.mt.sel{border-color:var(--accent);background:var(--soft)}
.mt.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
.mt.done{opacity:.4;border-color:var(--good);background:var(--good-soft);cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.mt.bad{animation:none}}
.cmb,.combo{color:var(--warn);font-weight:700}
.rgrid{grid-template-columns:repeat(2,1fr)!important}
.recwrap{display:flex;align-items:center;gap:14px}
.rec{all:unset;cursor:pointer;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--bad);color:#fff;flex:none;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.rec svg{width:34px;height:34px}
.rec[disabled]{opacity:.4;cursor:default}
.rec.on{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--bad-soft)}50%{box-shadow:0 0 0 14px var(--bad-soft)}}
@media (prefers-reduced-motion:reduce){.rec.on{animation:none;outline:4px solid var(--bad-soft)}}
</style></head><body>

<div id="app"></div>
<div id="toast" hidden></div>

<script>
const IV=[0,1,2,4,7,15,30];
const APP_VER='11.06-c';
const LESSON_LEN=10;          // cards per lesson
const REVIEW_PER_LESSON=2;    // of those, due reviews when new cards remain
/* progress counts only expressions a lesson can ask (cards with an English line) */
const progText=cs=>{const ls=cs.filter(c=>c.en);return `${ls.filter(c=>getP(c)).length}/${ls.length}`};
const reviewCount=cs=>cs.filter(c=>{const p=getP(c);return p&&p.d<=today()}).length;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/`(.+?)`/g,'<code>$1</code>');
const strip=s=>String(s??'').replace(/\*\*|\*|`/g,'').trim();
const isEn=s=>(String(s).match(/[A-Za-z]/g)||[]).length>(String(s).match(/[가-힣]/g)||[]).length;
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const today=()=>ymd(new Date());
function addDays(n,from){const d=from?new Date(from+'T12:00'):new Date();d.setDate(d.getDate()+n);return ymd(d)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function lsGet(k){try{return JSON.parse(localStorage.getItem('shadow.'+k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem('shadow.'+k,JSON.stringify(v))}catch(e){}}
const ICON={
  speak:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
  slow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5"/></svg>',
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  mix:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h13"/></svg>',
  ear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 3-2 4-3 5.5S14 18 12 19.5 7.5 20 7 17.5"/><path d="M9.5 9.5a2.5 2.5 0 0 1 5 0c0 1.5-1.5 2-1.5 3"/></svg>',
  mouth:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12c3-4 6-5 9-3 3-2 6-1 9 3-3 5-6 6-9 6s-6-1-9-6z"/><path d="M3 12h18"/></svg>'
};

/* ---------- markdown note → cards + quiz ---------- */
function cells(line){return line.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim())}
function parseNote(md){
  const L=String(md).replace(/\r/g,'').split('\n');
  const cards=[],quiz=[],ans={},refs=[];let h2='',h3='',inQuiz=false,m,lastRef=null;
  const sec=()=>h3?h2+' · '+h3:h2;
  for(let i=0;i<L.length;i++){
    const line=L[i];
    /* "## 1. blow minds — 뜻" with a body of **label:** lines and bullets (one expression per heading) */
    if((m=line.match(/^##\s+\d+\.\s+(.+?)\s+[—–]\s+(.+)$/))&&isEn(strip(m[1]))){
      let j=i+1;const body=[];
      while(j<L.length&&!/^#{1,3}\s/.test(L[j])&&!/^---\s*$/.test(L[j])){body.push(L[j]);j++}
      const extras=[];
      for(let k=0;k<body.length;k++){
        const b=body[k],bm=b.match(/^\s*(?:-\s+)?\*\*(.+?)\*\*\s*(.*)$/);
        if(!bm||/^\s{2,}-/.test(b))continue;
        let label=strip(bm[1]).replace(/[:：?]\s*$/,'').trim(),val=bm[2].replace(/^[:：]\s*/,'').trim();
        if(!val){const sub=[];while(body[k+1]&&/^\s{2,}-\s+/.test(body[k+1]))sub.push(body[++k].replace(/^\s+-\s+/,''));val=sub.join(' / ')}
        if(body[k+1]&&/^→/.test(body[k+1].trim()))val+=' '+body[++k].trim();
        if(val)extras.push([label,val]);
      }
      cards.push({front:strip(m[1]),back:m[2].trim(),extras,sec:'표현 정리'});
      h2='표현 정리';h3='';inQuiz=false;i=j-1;continue;
    }
    if((m=line.match(/^##\s+(.*)/))){h2=strip(m[1]).replace(/^[^\w가-힣]+/,'');h3='';inQuiz=/퀴즈/.test(h2);continue}
    if((m=line.match(/^###\s+(.*)/))){
      const title=m[1].trim();let j=i+1;const body=[];
      while(j<L.length&&!/^#{1,3}\s/.test(L[j])&&!/^---\s*$/.test(L[j])){body.push(L[j]);j++}
      const mean=body.find(b=>/^\s*-\s*\*\*뜻\*\*/.test(b));
      if(mean){
        const extras=[];
        for(const b of body){
          if(!b.trim()||b===mean)continue;
          const bm=b.match(/^\s*-\s*\*\*(.+?)\*\*\s*[:：]\s*(.*)/);
          if(bm)extras.push([bm[1],bm[2]]);
          else if(/^\s*-\s+/.test(b))extras.push(['메모',b.replace(/^\s*-\s+/,'')]);
        }
        cards.push({front:strip(title),back:mean.replace(/^\s*-\s*\*\*뜻\*\*\s*[:：]\s*/,''),extras,sec:h2});
        i=j-1;continue;
      }
      h3=strip(title).replace(/^[^\w가-힣]+/,'');continue;
    }
    if(/^\s*\|/.test(line)&&L[i+1]&&/^\s*\|?\s*:?-{2,}/.test(L[i+1])){
      const head=cells(line);let j=i+2;const rows=[];
      while(j<L.length&&/^\s*\|/.test(L[j])){rows.push(cells(L[j]));j++}
      i=j-1;
      /* a leading "#" numbering column carries no content */
      if(head[0]==='#'){head.shift();rows.forEach(r=>r.shift())}
      /* a speaker column (남/여) is not the expression */
      if(/^(누가|화자|speaker|who)$/i.test(head[0])){head.shift();rows.forEach(r=>r.shift())}
      /* word-root and pronunciation-rule tables are not cards — they feed the explanation of cards that use those words */
      const h0=strip(head[0]||'');
      if(/^(뿌리|어원|root)/i.test(h0)){
        const ki=Math.max(head.findIndex(h=>/단어/.test(h)),2);
        for(const r of rows)if(r[0])refs.push({t:'어원',keys:strip(r[ki]||'').replace(/[()]/g,' ').split(/[\/,]/).map(x=>x.trim()).filter(Boolean),
          text:strip(r[0])+' = '+strip(r[1]||'')+(r[ki+1]?' · 같은 가족: '+strip(r[ki+1]):'')});
        continue;
      }
      if(/^법칙/.test(h0)){
        for(const r of rows)for(const part of strip(r[1]||'').split(/\s+\/\s+/)){
          const pm=part.match(/^(.+?)\s*→\s*(.+)$/);if(pm)refs.push({t:'발음',keys:[pm[1]],text:pm[1]+' → '+pm[2]+' ('+strip(r[0])+')'});
        }
        continue;
      }
      const gram=/포인트|문법/.test(h0);
      const pair=head.length>=3&&/차이/.test(head[2]);
      const ko=/한국어/.test(head[0]);
      for(const r of rows){
        if(!r[0])continue;
        if(head.length===2&&/차이/.test(head[1])){cards.push({front:strip(r[0]),back:r[1]||'—',extras:[],sec:sec(),kind:'pair'});continue}
        if(pair)cards.push({front:strip(r[0])+'  vs  '+strip(r[1]),back:r[2]||'—',extras:[],sec:sec(),kind:'pair'});
        else cards.push({front:strip(r[0]),back:r[1]||'',extras:head.slice(2).map((h,k)=>[h,r[k+2]||'']).filter(x=>x[1]),sec:sec(),kind:ko?'ko':'',...(gram?{gram:1}:{})});
      }
      continue;
    }
    if(inQuiz){
      const qm=line.match(/^(\d+)\.\s+(.*_{2,}.*)$/);
      /* quiz parts "### B. 빈칸 채우기" match answers under "**B.**" */
      if(qm){quiz.push({n:+qm[1],q:qm[2].trim(),sec:h2,g:(h3.match(/^([A-Z])\./)||[])[1]||''});continue}
      if(/<summary>/.test(line)){
        let j=i+1,txt='';
        while(j<L.length&&!/<\/details>/.test(L[j])){txt+=' '+L[j];j++}
        i=j;
        const parts=txt.split(/\*\*([A-Z])\.\*\*/);
        for(let p=0;p<parts.length;p+=2){
          const g=p?parts[p-1]:'',re=/(\d+)\.\s*(.+?)(?=\s*·?\s*\d+\.\s|\s*$)/g;let a;

        }

    }
    /* theme groupings and clinic sentences: kept as explanation notes, then the normal list rules still run */
    if(/테마|분류|진료실|응용/.test(h2)){
      const bm=line.match(/^(\s*)-\s+(.+)$/),clinic=/진료실|응용/.test(h2);
      const bolds=t=>[...t.matchAll(/\*\*([^*]+)\*\*/g)].map(x=>x[1].trim()).filter(isEn);
      if(bm&&bm[1].length>=2&&lastRef)lastRef.text+=' — '+strip(bm[2]);
      else if(bm)refs.push(lastRef={t:clinic?'진료실':'장면',keys:clinic?bolds(bm[2]):[],line:strip(bm[2]),text:(!clinic&&h3?h3+': ':'')+strip(bm[2])});
      else if(clinic&&/^⚠️/.test(line))refs.push(lastRef={t:'주의',keys:bolds(line),text:strip(line.replace(/^⚠️\s*/,''))});
    }
    if((m=line.match(/^\s*(?:\d+\.|-)\s+\*\*(.+?)\*\*\s*(?:—|–|-|:)\s*(.+)$/))){
      const b=strip(m[1]);const eq=b.split(/\s+=\s+/);
      /* only English → Korean-meaning items become cards (skips word-root lists and Korean labels) */
      if(isEn(eq[0])&&!/[가-힣]/.test((eq.length>1?eq.slice(1).join(' '):'')+m[2]))continue;
      if(isEn(eq[0])&&/\([^)]*[가-힣][^)]*\)/.test(m[1])&&eq.length===1&&!/[가-힣]{2,}/.test(m[2].replace(/\([^)]*\)/g,'')))continue;
      if(eq.length>1)cards.push({front:eq[0],back:eq.slice(1).join(' = '),extras:[['예문',m[2]]],sec:sec()});
      else cards.push({front:b,back:m[2],extras:[],sec:sec()});
      continue;
    }
    if((m=line.match(/^\*\*(.+?)\*\*\s*[:：]\s*(.+)$/))&&isEn(strip(m[1]))&&/[가-힣]/.test(m[2]))cards.push({front:strip(m[1]),back:m[2],extras:[],sec:sec()});
  }
  quiz.forEach(q=>{q.a=ans[q.g+q.n]||ans[q.n]||'';delete q.g});
  /* the same English sentence twice in one note (script + expression table) stays one card */
  /* the duplicate's meaning and notes move onto the card that stays */
  const seen=new Map();
  return {refs,cards:cards.filter(c=>{
    const f=strip(c.front).toLowerCase().replace(/[^a-z' ]/g,'').replace(/\s+/g,' ').trim();
    if(!isEn(c.front)||f.split(' ').length<3)return true;
    const k=seen.get(f);
    if(k){const more=[strip(c.back)!==strip(k.back)?c.back:'',...c.extras.map(e=>e[1])].filter(Boolean).join(' · ');if(more)k.extras.push(['풀이',more]);return false}
    seen.set(f,c);return true;
  }),quiz};
}
/* the English line to hear/say, and the Korean meaning to show */
function engText(c){
  if(c.kind==='pair')return '';
  let s=strip(c.kind==='ko'?c.back:c.front);
  s=s.replace(/\([^)]*[가-힣][^)]*\)/g,' ');
  if(c.kind==='ko')s=s.split(/[\/,]/)[0];
  s=s.split('→').pop().replace(/[()]/g,'').replace(/^[…\.\s"]+|[…\s",]+$/g,'').replace(/\s+/g,' ').trim();
  return /[가-힣]/.test(s)?'':s;
}
function meanText(c){
  /* drop "(※ …)" notes and any parenthetical holding English, so the prompt never gives away the answer */
  const s=c.kind==='ko'?strip(c.front):strip(c.back).replace(/\(※[^)]*\)/g,'').replace(/\s*\([^)]*[A-Za-z][^)]*\)/g,'');
  return s.replace(/\s+/g,' ').trim();
}
function buildNote(id,v){
  v={...v,label:String(v.label||v.title||id).replace(/\s*(쉐도잉\s*)?영어\s*(표현|정리)\s*$/,'').trim()||v.label};
  const p=parseNote(v.md||'');
  p.cards.forEach((c,i)=>{c.idx=i;c.note=id;c.id=hash(c.front+'|'+strip(c.back).slice(0,40));c.key=id+'/'+c.id;c.en=engText(c);c.ko=meanText(c);c.words=c.en?c.en.split(' ').length:0});
  p.quiz.forEach((q,k)=>{q.note=id;q.key=id+'/q'+k});
  return {id,title:v.title||'',label:v.label||v.title||id,date:v.date||'',md:v.md||'',cards:p.cards,quiz:p.quiz,refs:p.refs};
}

const TTS='speechSynthesis' in window;
let VOICE=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices().filter(v=>/^en[-_](US|GB)/i.test(v.lang));VOICE=vs.find(v=>/Samantha|Google US English|Aria|Jenny|Natural|Ava/i.test(v.name))||vs.find(v=>/^en[-_]US/i.test(v.lang))||vs[0]||null}catch(e){}}

/* recorded AI voice clips (audio/<hash>.mp3) win over the phone's own voice */
const CLIPS=new Set();let CLIP=null;

/* ---------- lesson building ---------- */
const LISTEN=['listen','dictate','arrangeEar'],SPEAKT=['shadow','sayIt'];
/* every exercise is answered by tapping; speaking ones can be switched off for quiet places */
const speakOn=()=>lsGet('speak')!==false;
function typesFor(c,mode){
  const sent=c.words>=3&&c.words<=14;const t=[];
  if(mode==='speak'&&!speakOn())mode='mix';
  if(mode!=='speak'){
    if(TTS)t.push('listen');
    if(sent)t.push(mode==='listen'&&TTS?'arrangeEar':'arrange');
    if(mode==='mix')t.push('choose');
  }
  if(mode!=='listen'&&speakOn())t.push('shadow');
  return t.length?t:['choose'];
}
function makeCloze(q){
  const parts=a=>a.split(/\s*[,\/]\s*/).length;
  const others=notesSorted().flatMap(n=>n.quiz).filter(x=>x.a&&normK(x.a)!==normK(q.a));
  let pool=shuffle(others.filter(x=>parts(x.a)===parts(q.a)).map(x=>x.a));
  if(pool.length<3)pool=pool.concat(shuffle(others.map(x=>x.a)));
  const opts=[q.a];
  for(const a of pool){if(opts.length>=4)break;if(!opts.some(o=>normK(o)===normK(a)))opts.push(a)}
  return {type:'cloze',q,copts:shuffle(opts)};
}
/* what the last lessons showed, so back-to-back lessons don't repeat themselves (a missed item still comes back once inside its own lesson) */
const RECENT=lsGet('recent')||{};let SEQ=lsGet('seq')||0;
const recentPenalty=k=>RECENT[k]&&SEQ-RECENT[k]<2?10:0;
function markShown(keys){
  SEQ++;for(const k of keys)RECENT[k]=SEQ;
  for(const k in RECENT)if(SEQ-RECENT[k]>5)delete RECENT[k];
  lsSet('recent',RECENT);lsSet('seq',SEQ);
}
const hasWords=(text,part)=>(' '+text+' ').includes(' '+part+' ');
function buildLesson(mode,src,practice){
  let pool=srcCards(src).filter(c=>c.en);
  if(!pool.length)return null;
  /* only new and due cards make a lesson; learned cards come back on their own day, or when asked for practice */
  if(!practice&&!pool.some(c=>{const p=getP(c);return !p||p.d<=today()}))return {empty:true};
  /* move forward: a couple of due reviews, then new cards in note order (oldest note first, top to bottom) */
  const t=today();
  const due=shuffle(pool.filter(c=>{const p=getP(c);return p&&p.d<=t})).sort((a,b)=>recentPenalty(a.key)-recentPenalty(b.key));
  /* dated daily notes first (oldest first), then the undated workbooks */
  const nkey=c=>{const d=S.notes[c.note].date;return d?'0'+d:'1'};
  const neu=pool.filter(c=>!getP(c)).sort((a,b)=>nkey(a).localeCompare(nkey(b))||a.note.localeCompare(b.note)||a.idx-b.idx);
  const later=pool.filter(c=>{const p=getP(c);return p&&p.d>t}).sort((a,b)=>getP(a).d<getP(b).d?-1:1);
  const nRev=neu.length?Math.min(REVIEW_PER_LESSON,due.length):due.length;
  pool=practice?shuffle(later):[...due.slice(0,nRev),...neu,...due.slice(nRev)];
  const quizzes=mode==='speak'?[]:shuffle(notesSorted().filter(n=>src==='due'||n.id===src).flatMap(n=>n.quiz).filter(q=>q.a&&!recentPenalty(q.key))).sort((a,b)=>(RECENT[a.key]||0)-(RECENT[b.key]||0)).slice(0,1);
  /* a card whose phrase is the same as a fill-in sentence's would just repeat it */
  const qText=quizzes.map(q=>normE(fillCloze(q))),qAns=quizzes.map(q=>normE(q.a.replace(/,/g,' '))).filter(a=>a.length>2);
  pool=pool.filter(c=>{const e=normE(c.en);return !qText.some(s=>hasWords(s,e)||hasWords(e,s))&&!qAns.some(a=>hasWords(e,a))});
  const wantMatch=mode==='mix';
  const nCards=Math.min(pool.length,LESSON_LEN);
  const items=[];const used={};
  for(const c of shuffle(pool.slice(0,nCards))){
    let ts=typesFor(c,mode);
    const fresh=ts.filter(x=>(used[x]||0)<Math.ceil(LESSON_LEN/3));
    const type=pick(fresh.length?fresh:ts);used[type]=(used[type]||0)+1;
    items.push(makeItem(type,c,pool));
  }
  quizzes.forEach(q=>items.splice(Math.floor(Math.random()*(items.length+1)),0,makeCloze(q)));
  if(wantMatch){
    /* pairs come from cards this lesson isn't already asking about */
    /* pairs review cards already learned that this lesson isn't asking about */
    const inLesson=new Set(pool.slice(0,nCards).map(c=>c.key));
    const m=makeMatch(shuffle(srcCards(src).filter(c=>getP(c)&&!inLesson.has(c.key))));
    if(m)items.splice(Math.floor(items.length/2),0,m);
  }
  markShown(items.flatMap(it=>it.type==='match'?it.pairs.map(c=>c.key):[it.c?it.c.key:it.q.key]));
  /* each exercise keeps its own answer state so the learner can step back through answered ones */
  return lessonObj({mode,src,practice:!!practice,items,i:0,max:0,states:[],xp:0,firstOk:0,firstTotal:items.length,combo:0,best:0,graded:new Set(),requeued:new Set()});
}
function lessonObj(o){
  return Object.defineProperty(o,'st',{get(){return this.states[this.i]??=fresh()},set(v){this.states[this.i]=v}});
}
/* ---------- keep an unfinished lesson so it can be resumed ---------- */

  const ser=it=>({type:it.type,c:it.c?.key,q:it.q?.key,opts:it.opts?.map(o=>o.key),field:it.field,bank:it.bank,pairs:it.pairs?.map(c=>c.key),left:it.left,right:it.right,key:it.key,copts:it.copts});
  lsSet('lesson',{v:1,mode:L.mode,src:L.src,practice:L.practice,i:L.i,max:L.max,xp:L.xp,firstOk:L.firstOk,firstTotal:L.firstTotal,combo:L.combo||0,best:L.best||0,
    graded:[...L.graded],requeued:[...L.requeued],items:L.items.map(ser),
    states:L.states.map(s=>s&&{...s,listening:false,pushed:s.pushed?L.items.lastIndexOf(s.pushed):-1})});
}
function loadLesson(){
  const d=lsGet('lesson');if(!d||d.v!==1)return null;
  const quizzes=notesSorted().flatMap(n=>n.quiz),need=x=>{if(!x)throw 0;return x};
  try{
    const items=d.items.map(x=>({...x,
      c:x.c?need(cardByKey(x.c)):undefined,q:x.q?need(quizzes.find(q=>q.key===x.q)):undefined,
      opts:x.opts?x.opts.map(k=>need(cardByKey(k))):undefined,pairs:x.pairs?x.pairs.map(k=>need(cardByKey(k))):undefined}));
    return lessonObj({mode:d.mode,src:d.src,practice:d.practice,items,i:d.i,max:d.max,xp:d.xp,firstOk:d.firstOk,firstTotal:d.firstTotal,combo:d.combo,best:d.best,
      graded:new Set(d.graded),requeued:new Set(d.requeued),states:d.states.map(s=>s&&{...s,pushed:s.pushed>=0?items[s.pushed]:false})});
  }catch(e){lsSet('lesson',null);return null}
}
function fresh(){return {sel:null,tiles:[],typed:'',revealed:false,result:null,said:0,mdone:[],mmiss:0,msel:null,mbad:null}}
function makeItem(type,c,pool){
  const it={type,c};
  if(type==='listen'||type==='choose'){
    const field=type==='listen'?'ko':'en';
    const others=shuffle(allCards().filter(x=>x!==c&&x[field]&&x[field]!==c[field]&&x.en));
    const seen=new Set([c[field]]);const opts=[c];
    for(const x of others){if(opts.length>=4)break;if(!seen.has(x[field])){seen.add(x[field]);opts.push(x)}}
    it.opts=shuffle(opts);it.field=field;
  }
  if(type==='arrange'||type==='arrangeEar'){
    const words=c.en.split(' ');

/* spoken input arrives as "I am"/"2 minutes" as often as "I'm"/"two minutes", so compare in one expanded form */

  .replace(/\b\d{1,2}\b/g,d=>NUM[+d]||d).replace(/\bcannot\b/g,'can not').replace(/\bok\b/g,'okay')

const normK=s=>String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9가-힣' ]+/g,' ').replace(/\s+/g,' ').trim();

function autoPlay(){const it=curItem();if(it&&['listen','dictate','arrangeEar','shadow'].includes(it.type))say(it.c.en)}
function canCheck(){
  const it=curItem(),st=S.lesson.st;
  if(['listen','choose'].includes(it.type))return st.sel!=null;
  if(it.type.startsWith('arrange'))return st.tiles.length>0;
  if(it.type==='cloze'&&it.copts)return st.sel!=null;
  if(['dictate','cloze','shadow','sayIt'].includes(it.type))return st.typed.trim().length>0;
  return false;
}
function check(){
  const it=curItem(),st=S.lesson.st;if(st.result||!canCheck())return;
  let ok=false,close=false;
  if(['listen','choose'].includes(it.type))ok=it.opts[st.sel]===it.c;
  else if(it.type.startsWith('arrange'))ok=normE(st.tiles.map(k=>it.bank.find(b=>b.k===k).w).join(' '))===normE(it.c.en);
  else if(['dictate','shadow','sayIt'].includes(it.type)){const m=wordDiff(st.typed,it.c.en);ok=m.close;close=ok&&!m.exact}
  else if(it.type==='cloze')ok=it.copts?it.copts[st.sel]===it.q.a:normK(st.typed)===normK(it.q.a);
  finish(ok,close);
}
function finish(ok,close){
  const L=S.lesson,it=curItem();
  L.st.result=ok?(close?'close':'ok'):'no';
  const key=(it.c?.key||it.q?.key||it.key)+':'+it.type;
  const first=!L.requeued.has(key);
  if(first&&ok){L.firstOk++;L.xp+=2}
  if(it.c&&!L.graded.has(it.c.key)){L.graded.add(it.c.key);grow(it.c,ok)}
  L.st.first=first;L.st.pushed=false;L.st.prevCombo=L.combo||0;
  if(ok&&first){L.combo=(L.combo||0)+1;L.best=Math.max(L.best||0,L.combo)}else if(!ok)L.combo=0;
  L.st.combo=L.combo;
  if(!ok&&first){L.requeued.add(key);const again=it.type==='cloze'?{...it}:makeItem(it.type,it.c);L.items.push(again);L.st.pushed=again}
  render();

  const line=it.c&&(!ok||!['listen','dictate','shadow'].includes(it.type))?it.c.en:it.type==='cloze'&&ok?fillCloze(it.q):'';
  if(line)setTimeout(()=>say(line),380);
}
/* ---------- match pairs ---------- */
function makeMatch(cands){
  const pool=cands.filter(c=>c.en&&c.words<=6&&c.ko&&c.ko.length<=26);
  const pairs=[],seenE=new Set(),seenK=new Set();
  for(const c of pool){if(pairs.length>=5)break;const e=normE(c.en);if(seenE.has(e)||seenK.has(c.ko))continue;seenE.add(e);seenK.add(c.ko);pairs.push(c)}
  if(pairs.length<4)return null;
  const idx=pairs.map((_,i)=>i);
  return {type:'match',key:'match:'+pairs.map(c=>c.id).join('.'),pairs,left:shuffle([...idx]),right:shuffle([...idx])};
}
function mpick(v){
  const L=S.lesson,st=L.st,it=curItem();if(!it||it.type!=='match'||st.result)return;
  const side=v[0],i=+v.slice(2);

  st.msel=null;
  if(a===b){st.mdone.push(a);st.mbad=null;if(st.mdone.length===it.pairs.length)finish(true);else{sfx('tick');render()}}

}

let AC=null;

function sfx(kind){

}

/* everything else the same note says about this card: the phrases inside a sentence, the sentence a phrase came from,

function noteLinks(c){
  const n=S.notes[c.note];if(!n)return [];
  const me=normE(c.en||strip(c.front)),words=me.split(' ').length,rows=[];
  const has=(text,k)=>{k=normE(k).replace(/[~…]/g,'').trim();if(k.length<3)return false;
    return hasWords(text,k)||(/^be /.test(k)&&k.split(' ').length>=2&&hasWords(text,k.slice(3)))};
  const add=(label,html,max)=>{if(rows.filter(r=>r[0]===label).length<max&&!rows.some(r=>r[1]===html))rows.push([label,html])};
  const others=n.cards.filter(x=>x!==c&&x.en&&!x.gram&&x.kind!=='pair');
  if(words>=3)for(const x of others){if(x.words<=words&&/[a-z]{4}/.test(normE(x.en))&&has(me,x.en))
    add('표현',`<b>${esc(x.en)}</b> — ${inl(x.back)}${x.extras.length?'<br><span class="mut">'+x.extras.map(e=>inl(e[1])).join(' · ')+'</span>':''}`,4)}
  if(words<=5)for(const x of others)if(x.words>words&&x.words>=3&&has(normE(x.en),c.en||c.front))
    add('원문',`<b>${esc(x.en)}</b> — ${inl(x.back)}`,2);
  for(const x of n.cards.filter(x=>x.gram&&x!==c)){
    const keys=[...strip(x.back.replace(/\*\*/g,'')).matchAll(/([A-Za-z][A-Za-z' ,.?!-]{3,})/g)].map(m=>m[1]);
    const k2=[...x.back.replace(/\*\*/g,'').matchAll(/\*([^*]+)\*/g)].map(m=>m[1]).filter(t=>!/❌/.test(t));
    if((k2.length?k2:keys).some(k=>k.split(' ').length>=2&&has(me,k.replace(/[.?!]+$/,''))))
      add('문법',`<b>${esc(strip(x.front))}</b> — ${x.extras.map(e=>inl(e[1])).join(' · ')||inl(x.back)}`,2);
  }
  if(c.kind!=='pair')for(const x of n.cards.filter(x=>x.kind==='pair')){
    const keys=strip(x.front).split(/\s+vs\s+|\s*\/\s*/).map(k=>k.replace(/\([^)]*\)|\+.*$/g,'').trim());
    if(keys.some(k=>has(me,k)))add('헷갈리는 짝',`<b>${esc(strip(x.front))}</b> — ${inl(x.back)}`,2);
  }

    if(r.t==='장면'){const l=normE(r.line);if(words>=3?hasWords(l,me):false)add('장면',inl(r.text),1);continue}
    if(r.t==='진료실'){
      /* a bold key of 5+ letters (or 2+ words), or a shared two-word chunk like "aside from", "be patient" */
      const l=normE(r.line.replace(/\s[—–-]\s.*$|\([^)]*[가-힣][^)]*\)/g,''));
      const sw=new Set(['does','did','get','just','one','like','the','a','an','to','of','and','you','your','i','it','is','are','am','me','my','in','on','for','do','that','this','with','not','so','be','was','have','will']);
      const bi=t=>{const w=t.split(' ');return w.slice(1).map((x,i)=>w[i]+' '+x).filter(b=>b.split(' ').some(x=>!sw.has(x)&&x.length>=4))};
      const mine=new Set(bi(me));
      if(r.keys.some(k=>(k.includes(' ')||k.length>=5)&&has(me,k))||bi(l).some(b=>mine.has(b)))add('진료실에서',inl(r.text),2);
      continue;
    }
    if(r.keys.some(k=>has(me,k)))add(r.t,inl(r.text),r.t==='발음'?3:2);

function explainCard(c,title){

  /* a written explanation (explain.json: 유래·예문·메모) stands in for the note's short notes; clinic sentences still follow */
  const x=S.xpl[c.note+'|'+c.front];
  const rows=x?[['뜻',inl(c.back)],...Object.entries(x).map(([k,v])=>[esc(k),inl(v)]),...noteLinks(c).filter(r=>r[0]==='진료실에서')]
    :[['뜻',inl(c.back)],...c.extras.map(([k,v])=>[esc(k==='뜻'?'뜻 풀이':k),inl(v)])].filter(r=>r[1]).concat(noteLinks(c));
  return `${title?`<div class="xt">${esc(title)}</div>`:''}<dl class="ex">${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
}
function relatedCard(q){
  const s=normE(fillCloze(q)),ans=normE(q.a.replace(/[,\/]/g,' '));
  const cs=(S.notes[q.note]?.cards||[]).filter(c=>c.en);
  /* the card must carry at least one answer word, so a short grammar card can't hijack the match */
  const aw=ans.split(' ').filter(Boolean),holds=c=>aw.some(w=>hasWords(normE(c.en),w));
  const exact=cs.find(c=>holds(c)&&hasWords(s,normE(c.en)))||cs.find(c=>aw.every(w=>hasWords(normE(c.en),w)));
  if(exact)return exact;
  /* the answer phrase written inside a card's explanation (e.g. "반대말: out of it"), or glued into a word (party+goers) */
  const inNotes=aw.length>=2&&cs.find(c=>hasWords(normE(c.back+' '+c.extras.map(x=>x[1]).join(' ')),ans));
  if(inNotes)return inNotes;
  const glued=aw.length===1&&aw[0].length>=4&&cs.find(c=>normE(c.en).includes(aw[0]));
  if(glued)return glued;
  /* inflected answers (blew my mind ↔ blow minds): compare word beginnings of the answer's content words */
  const STOP=new Set(['the','and','you','your','my','his','her','its','our','their','one','ones','oneself','myself','yourself','someone','something','with','for','that','this','not','are','was','have','has']);
  const stems=t=>normE(t).split(' ').filter(w=>w.length>=3&&!STOP.has(w)).map(w=>w.slice(0,4));
  const want=stems(q.a.replace(/[,\/]/g,' '));if(!want.length)return null;
  let best=null,bs=0;
  for(const c of cs){const have=new Set(stems(c.en));const sc=want.filter(w=>have.has(w)).length/want.length;if(sc>bs){bs=sc;best=c}}
  return bs>=.5?best:null;
}
function explainHtml(it){
  let h='';
  if(it.type==='match')h=it.pairs.map(c=>`<div><b class="en">${esc(c.en)}</b> — ${esc(c.ko)}</div>`).join('');
  else if(it.type==='cloze'){
    const ko=clozeKo(it.q),rc=relatedCard(it.q);
    h=`<div class="en">${esc(fillCloze(it.q))}</div>${ko.tr?`<div>${esc(ko.tr)}</div>`:''}${rc?explainCard(rc,rc.front):''}`;
  }
  else h=explainCard(it.c);

}
function clozeKo(q){
  const m=q.q.match(/\(([^)]*[가-힣][^)]*)\)/);const paren=m?m[1].trim():'';
  const tr=S.qko[q.note+'#'+q.n]||'';
  return {tr:tr||paren,extra:tr&&paren&&paren!==tr?paren:''};
}
/* answers come as "a, b", "a / b" or "a b c" — match them to blank groups, else to single blanks */
function fillCloze(q){
  const groups=q.q.match(/(_{2,}\s*)+/g)||[],nBlanks=groups.reduce((s,g)=>s+(g.match(/_{2,}/g)||[]).length,0);
  const parts=q.a.split(/\s*[,\/]\s*/),words=q.a.split(/[\s,\/]+/).filter(Boolean);
  let gi=0,bi=0;
  return q.q.replace(/\([^)]*\)/g,'').replace(/(_{2,}\s*)+/g,m=>{
    const k=(m.match(/_{2,}/g)||[]).length;let w;
    if(parts.length===groups.length&&groups.length>1)w=parts[gi];
    else if(parts.length>=nBlanks&&nBlanks>1)w=parts.slice(bi,bi+k).join(' ');
    else if(groups.length>1&&words.length===nBlanks)w=words.slice(bi,bi+k).join(' ');
    else w=q.a;
    gi++;bi+=k;return w+' ';
  }).replace(/\*+/g,'').replace(/(^|\s)[AB]:\s+/g,'$1').replace(/\s+/g,' ').replace(/ ([.,?!])/g,'$1').trim();
}

}

  if(!q){box.innerHTML='';return}
  const hits=allCards().filter(c=>normK(c.front+' '+c.back+' '+c.extras.map(x=>x[1]).join(' ')).includes(q)).slice(0,80);
  box.innerHTML=hits.length?cardList(hits):'<div class="hint">찾는 표현이 없어요.</div>';
}

/* ---------- notes add/delete ---------- */
function labelFromFile(name){return name.replace(/\.(md|markdown|txt)$/i,'').replace(/^\d{4}-\d{2}-\d{2}[_ -]*/,'').replace(/_/g,' ').trim()}
async function addNote(md,fileName){
  const title=strip((md.match(/^#\s+(.+)$/m)||[])[1]||'');
  const date=((fileName||'')+' '+title+' '+md).match(/\d{4}-\d{2}-\d{2}/)?.[0]||today();
  const label=(fileName&&labelFromFile(fileName))||title.replace(/\(?\d{4}-\d{2}-\d{2}\)?/,'').trim()||'영어 표현';
  let id='n-'+date;const same=S.notes[id];
  if(same&&same.label!==label&&same.title!==title)id+='-'+hash(label);
  const v={title,label,date,md,addedAt:new Date().toISOString()};
  const built=buildNote(id,v);
  if(S.db){try{await S.db.collection('notes').doc(id).set(v)}catch(e){toast(e?.code==='quota_exceeded'?'저장 공간이 가득 찼어요. 오래된 노트를 지운 뒤 다시 올려 주세요.':'노트를 저장하지 못했어요 ('+(e?.code||'오류')+').');return}}
  built.local=true;S.notes[id]=built;saveLocalNotes();
  toast(`「${label}」 추가 · 카드 ${built.cards.length}장 · 퀴즈 ${built.quiz.length}문제`);
  if(!S.fc.started)buildFC();render();
}
function saveLocalNotes(){const o={};for(const n of Object.values(S.notes))if(n.local)o[n.id]={title:n.title,label:n.label,date:n.date,md:n.md};lsSet('notes',o)}
async function delNote(id){
  if(S.db){try{await S.db.collection('notes').doc(id).delete();if(S.uid)await S.db.collection('data/users/'+S.uid).doc(id).delete()}catch(e){toast('지우지 못했어요.');return}}
  const wasLocal=S.notes[id]?.local;delete S.notes[id];delete S.prog[id];
  if(!wasLocal){const hd=lsGet('hidden')||[];hd.push(id);lsSet('hidden',hd)}
  saveLocalNotes();lsSet('prog',S.prog);
  S.confirmDel=null;if(S.src===id)S.src='due';if(S.fc.deck===id)S.fc.deck='due';buildFC();render();toast('노트를 지웠어요.');
}
async function readFiles(files){for(const f of files){try{await addNote(await f.text(),f.name)}catch(e){toast(f.name+' 파일을 읽지 못했어요.')}}}

/* ---------- render + events ---------- */
function render(){
  const app=$('#app');
  if(S.lesson){saveLesson();app.innerHTML=viewLesson();const t=$('#typeIn');if(t&&!S.lesson.st.result&&!S.lesson.st.listening&&matchMedia('(pointer:fine)').matches)t.focus({preventScroll:true});return}
  app.innerHTML=shell(S.tab==='cards'?viewCards():S.tab==='notes'?viewNotes():viewHome())+(EXITASK?`<div class="modal" role="dialog" aria-modal="true"><div class="box">
    <b>이 앱을 종료할까요?</b><div class="hint">뒤로 가기를 한 번 더 누르면 종료돼요.</div>
    <div class="acts"><button class="btn" data-act="stay">계속 공부하기</button><button class="btn primary" data-act="quit">종료</button></div></div></div>`:'');
  if(S.tab==='notes')renderResults();
}
let tT=null;function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(tT);tT=setTimeout(()=>e.hidden=true,3200)}

document.addEventListener('click',e=>{
  if(NOCLICK){NOCLICK=false;return}
  const t=e.target.closest('[data-act],[data-tab]');if(!t||t.disabled)return;
  if(t.dataset.tab){
    const to=t.dataset.tab;
    if(S.tab==='home'&&to!=='home')pushIn();else if(to==='home'&&S.tab!=='home')popIn();
    S.tab=to;lsSet('tab',S.tab);if(S.tab==='cards'&&!S.fc.queue.length)buildFC();render();return}
  const v=t.dataset.v,L=S.lesson,it=curItem();
  switch(t.dataset.act){
    case 'src':S.src=v;render();break;
    case 'goal':S.stats.goal=+v;dirty.add('stats');queueSave();render();break;
    case 'sfx':lsSet('sfx',v==='1');render();if(v==='1')sfx('ok');break;
    case 'speakset':lsSet('speak',v==='1');render();toast(v==='1'?'말하기 문제를 다시 넣어요.':'이제 누르기만으로 푸는 문제만 나와요.');break;
    case 'mpick':mpick(v);break;
    case 'lesson':startLesson(v,L?.done);break;
    case 'newlesson':lsSet('lesson',null);startLesson(v,true);break;
    case 'practice':startLesson('mix',true,true);break;
    case 'exit':stopRec();S.lesson=null;flush();popIn();render();break;
    case 'stay':EXITASK=false;armGuard();render();break;
    case 'quit':EXITASK=false;render();try{window.close()}catch(e){}setTimeout(()=>toast('뒤로 가기를 한 번 더 누르면 종료돼요.'),300);break;
    case 'say':say(it?.c?.en||(it?.q?fillCloze(it.q):''));break;
    case 'saySlow':say(it?.c?.en,true);break;
    case 'sel':L.st.sel=+v;render();if(it.type==='choose')say(it.opts[+v].en);break;
    case 'tile':L.st.tiles.push(+v);render();break;
    case 'untile':L.st.tiles=L.st.tiles.filter(k=>k!==+v);render();break;
    case 'check':check();break;
    case 'next':next();break;
    case 'skipOk':finish(true);break;   // stays on the result sheet so the explanation shows; 계속 moves on
    case 'skipNo':finish(false);break;
    case 'override':override();break;
    case 'prev':prev();break;
    case 'fwd':if(L.i<L.max)next();break;
    case 'rec':toggleRec();break;
    case 'deck':S.fc.deck=v;buildFC();render();break;
    case 'dir':S.fc.dir=v;render();break;
    case 'flip':if(!e.target.closest('.speak')){S.fc.flipped=!S.fc.flipped;render()}break;
    case 'fgrade':fgrade(+v);break;
    case 'fcsay':{const c=cardByKey(S.fc.queue[S.fc.qi]);if(c)say(c.en);break}
    case 'again':buildFC();render();break;
    case 'study':S.src=v;S.tab='home';render();window.scrollTo(0,0);break;
    case 'toggle':S.openNote=S.openNote===v?null:v;render();break;
    case 'askdel':S.confirmDel=v;render();break;
    case 'nodel':S.confirmDel=null;render();break;
    case 'del':delNote(v);break;
    case 'addPaste':{const ta=$('#pasteIn');if(ta.value.trim()){addNote(ta.value,'');ta.value=''}else toast('붙여넣은 내용이 없어요.');break}
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='search')renderResults();
  if(e.target.id==='typeIn'&&S.lesson){S.lesson.st.typed=e.target.value;const b=document.querySelector('[data-act="check"]');if(b)b.disabled=!canCheck()}
});
document.addEventListener('change',e=>{if(e.target.id==='fileIn'){readFiles([...e.target.files]);e.target.value=''}});
document.addEventListener('dragover',e=>{const d=e.target.closest?.('#drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{e.target.closest?.('#drop')?.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest?.('#drop');if(d){e.preventDefault();d.classList.remove('over');readFiles([...e.dataTransfer.files])}});
document.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA/.test(document.activeElement?.tagName);
  if(S.lesson&&!S.lesson.done){
    const st=S.lesson.st,it=curItem();
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(st.result)next();else check();return}
    const opts=it.opts||it.copts;
    if(!typing&&!st.result&&opts&&/^[1-4]$/.test(e.key)&&opts[+e.key-1]){st.sel=+e.key-1;render()}
    return;
  }
  if(S.tab!=='cards'||typing)return;
  if(e.key===' '||e.key==='Enter'){if(S.fc.queue[S.fc.qi]){e.preventDefault();S.fc.flipped=!S.fc.flipped;render()}}
  else if(['1','2','3'].includes(e.key))fgrade(+e.key);
});

/* ---------- dragging word tiles: reorder the answer line, or move tiles between bank and answer ---------- */
let DRAG=null,NOCLICK=false;
document.addEventListener('pointerdown',e=>{
  const t=e.target.closest('.tile');if(!t||t.disabled||!S.lesson||S.lesson.st.result)return;
  DRAG={el:t,k:+t.dataset.v,from:t.closest('.answer')?'answer':'bank',x:e.clientX,y:e.clientY,on:false,id:e.pointerId,idx:null};
});
document.addEventListener('pointermove',e=>{
  const D=DRAG;if(!D||e.pointerId!==D.id)return;
  const dx=e.clientX-D.x,dy=e.clientY-D.y;
  if(!D.on){if(Math.hypot(dx,dy)<8)return;D.on=true;D.el.classList.add('drag');try{D.el.setPointerCapture(D.id)}catch(_){}}
  D.el.style.transform=`translate(${dx}px,${dy}px)`;
  const ans=$('.answer');if(!ans)return;
  ans.querySelectorAll('.tile.ins').forEach(x=>x.classList.remove('ins'));ans.classList.remove('ins-end');
  const ar=ans.getBoundingClientRect();D.idx=null;
  if(e.clientY>=ar.top-24&&e.clientY<=ar.bottom+24){
    const others=[...ans.querySelectorAll('.tile')].filter(x=>x!==D.el);
    let idx=others.length;
    for(let i=0;i<others.length;i++){const r=others[i].getBoundingClientRect();if(e.clientY<r.top||(e.clientY<=r.bottom&&e.clientX<r.left+r.width/2)){idx=i;break}}
    D.idx=idx;
    if(others[idx])others[idx].classList.add('ins');else ans.classList.add('ins-end');
  }
});
document.addEventListener('pointerup',e=>{
  const D=DRAG;if(!D||e.pointerId!==D.id)return;DRAG=null;
  if(!D.on)return;
  NOCLICK=true;setTimeout(()=>{NOCLICK=false},400);
  const st=S.lesson?.st;
  if(st){
    const rest=st.tiles.filter(k=>k!==D.k);
    if(D.idx!=null){rest.splice(D.idx,0,D.k);st.tiles=rest}
    else if(D.from==='answer')st.tiles=rest;
  }
  render();
});
document.addEventListener('pointercancel',e=>{if(DRAG&&e.pointerId===DRAG.id){DRAG=null;render()}});

/* ---------- start ---------- */
async function start(){
  render();
  let base={};
  try{const r=await fetch('notes.json',{cache:'no-cache'});if(r.ok)base=(await r.json()).notes||{}}catch(e){}
  const hidden=new Set(lsGet('hidden')||[]);
  for(const id in base)if(!hidden.has(id))S.notes[id]=buildNote(id,base[id]);
  const loc=lsGet('notes')||{};for(const id in loc){const b=buildNote(id,loc[id]);b.local=true;S.notes[id]=b}
  try{const r=await fetch('quiz-ko.json',{cache:'no-cache'});if(r.ok)S.qko=await r.json()}catch(e){}
  try{const r=await fetch('explain.json',{cache:'no-cache'});if(r.ok)S.xpl=await r.json()}catch(e){}
  try{const r=await fetch('audio/index.json',{cache:'no-cache'});if(r.ok)(await r.json()).forEach(h=>CLIPS.add(h))}catch(e){}
  S.prog=lsGet('prog')||{};S.stats=lsGet('stats')||S.stats;S.loaded=true;
  buildFC();render();
  try{navigator.storage?.persist?.()}catch(e){}
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
/* ---------- phone back button: close what's open inside the app, ask before leaving ---------- */
let EXITASK=false,SKIPPOP=false;
function pushIn(){try{history.pushState({app:'in'},'')}catch(e){}}
function armGuard(){try{history.pushState({app:'guard'},'')}catch(e){}}
/* an on-screen close used up the screen, so drop its history step too */
function popIn(){if(history.state?.app==='in'){SKIPPOP=true;history.back()}}
window.addEventListener('popstate',e=>{
  if(SKIPPOP){SKIPPOP=false;return}
  const at=e.state?.app;let closed=false;
  if(S.lesson){stopRec();S.lesson=null;flush();closed=true}
  else if(S.tab!=='home'){S.tab='home';lsSet('tab','home');closed=true}
  if(at==='root'){if(closed)armGuard();else EXITASK=true}
  render();
});
try{history.replaceState({app:'root'},'');armGuard();if(S.tab!=='home')pushIn()}catch(e){}
start();
</script>
